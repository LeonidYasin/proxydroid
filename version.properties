# Single source of truth for the app version.
#
# Bump ONE of these values in a PR to publish a new release:
#   VERSION_MAJOR  - breaking changes
#   VERSION_MINOR  - new features (backwards compatible)
#   VERSION_PATCH  - bug fixes
#
# On merge to the default branch, .github/workflows/auto-tag-release.yml
# creates the git tag vMAJOR.MINOR.PATCH, which in turn triggers
# .github/workflows/release-apk.yml to build and publish the APK.
#
# versionCode is derived as MAJOR*10000 + MINOR*100 + PATCH (so 3.5.0 -> 30500),
# which monotonically increases as long as each component stays below 100.

VERSION_MAJOR=3
VERSION_MINOR=5
VERSION_PATCH=0
