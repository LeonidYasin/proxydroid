name: ProxyDroid Android TV/Phone Signed Release
run-name: >-
  ProxyDroid · Android TV/Phone · universal · ${{ inputs.mode == 'backup' && 'encrypted backup' || 'signed release' }} · ${{ inputs.tag || github.ref_name }} · run ${{ github.run_id }} · attempt ${{ github.run_attempt }} · ${{ github.sha }}

# Signed release only. Manual dispatch without a tag builds an artifact, not a release.
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      tag:
        type: string
        required: false
        default: ''
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build signed APK or export an encrypted offline signing backup'
        type: choice
        options: [build, backup]
        default: build
      tag:
        description: 'Existing version tag to publish. Empty = build artifact only.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}-${{ inputs.mode || 'build' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: inputs.mode != 'backup'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.source_ref || github.ref }}

    - name: Validate signing configuration and release tag
      id: release
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        EXPECTED_SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || secrets.ANDROID_SIGNING_CERT_SHA256 }}
        INPUT_TAG: ${{ inputs.tag }}
      shell: bash
      run: |
        set -euo pipefail
        for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD EXPECTED_SIGNING_SHA256; do
          if [[ -z "${!name}" ]]; then
            echo "::error::Missing $name. Configure the persistent release keystore and certificate fingerprint; debug signing is not allowed."
            exit 1
          fi
        done
        fingerprint=$(printf '%s' "$EXPECTED_SIGNING_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Invalid signing certificate SHA-256'; exit 1; }
        pinned=$(tr -d ':[:space:]' < signing-certificate.sha256)
        [[ "$fingerprint" == "$pinned" ]] || { echo '::error::Signing fingerprint differs from reviewed repository pin'; exit 1; }
        python3 -m unittest discover -s scripts -p test_build_metadata.py
        python3 scripts/build_metadata.py --variant release --output build-info.json --github-output "$GITHUB_OUTPUT"
        VERSION=$(python3 -c 'import json; print(json.load(open("build-info.json"))["version"])')
        BUILD_SHA=$(git rev-parse HEAD)
        TAG="$INPUT_TAG"
        if [[ "$GITHUB_EVENT_NAME" == push ]]; then TAG="$GITHUB_REF_NAME"; fi
        if [[ -n "$TAG" ]]; then
          [[ "$TAG" == "v$VERSION" || "$TAG" == "v$VERSION-"* ]] || { echo '::error::Tag does not match version.properties'; exit 1; }
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$BUILD_SHA" ]] || { echo '::error::Tag does not point at this build commit'; exit 1; }
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest 2>/dev/null || true
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        fi
        if [ -z "$ANDROID_HOME" ]; then
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        fi
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        elif [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
          echo "$ANDROID_HOME/cmdline-tools/bin" >> $GITHUB_PATH
        fi
        if [ -d "$ANDROID_HOME/platform-tools" ]; then
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        fi

    - name: Install NDK and CMake
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "platforms;android-36" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

    - name: Setup Rust toolchain (Android targets for proxydroid-tun2socks)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          app/src/main/rust/proxydroid-tun2socks/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

    - name: Restore private signing keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/proxydroid-release.keystore"
        test -s "$RUNNER_TEMP/proxydroid-release.keystore"

    - name: Test and build signed Release APK
      env:
        BUILD_SHA: ${{ steps.release.outputs.sha }}
        KEYSTORE_PATH: ${{ runner.temp }}/proxydroid-release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        python3 scripts/check_tv_contract.py
        ./gradlew testReleaseUnitTest assembleRelease --no-daemon

    - name: Verify signature, certificate, non-debuggable flag and alignment
      env:
        EXPECTED_SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || secrets.ANDROID_SIGNING_CERT_SHA256 }}
        APK_NAME: ${{ steps.release.outputs.name }}
        BUILD_SHA: ${{ steps.release.outputs.sha }}
      shell: bash
      run: |
        set -euo pipefail
        APK=app/build/outputs/apk/release/app-release.apk
        TOOLS="$ANDROID_HOME/build-tools/34.0.0"
        mkdir -p dist
        "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "dist/$APK_NAME.signing.txt"
        actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "dist/$APK_NAME.signing.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        expected=$(printf '%s' "$EXPECTED_SIGNING_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        [[ "$actual" == "$expected" ]] || { echo '::error::Wrong signing certificate'; exit 1; }
        if grep -Eq 'Signer #1 certificate DN:.*CN=Android Debug' "dist/$APK_NAME.signing.txt"; then
          echo '::error::Android debug certificate is not a release identity'; exit 1
        fi
        "$TOOLS/zipalign" -c -v 4 "$APK"
        "$TOOLS/aapt" dump badging "$APK" > "dist/$APK_NAME.manifest.txt"
        if grep -q '^application-debuggable' "dist/$APK_NAME.manifest.txt"; then
          echo '::error::Release APK is debuggable'; exit 1
        fi
        python3 scripts/build_metadata.py --apk "$APK" --metadata build-info.json --dist dist --badging "dist/$APK_NAME.manifest.txt"
        (cd dist && sha256sum -c "$APK_NAME.apk.sha256")

    - name: Upload verified signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.release.outputs.name }}
        path: dist/
        if-no-files-found: error
        retention-days: 30

    - name: Publish signed APK to GitHub Release
      if: steps.release.outputs.tag != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
        TAG: ${{ steps.release.outputs.tag }}
        APK_NAME: ${{ steps.release.outputs.name }}
        BUILD_SHA: ${{ steps.release.outputs.sha }}
      shell: bash
      run: |
        set -euo pipefail
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo '::error::Release already exists. Do not change a published build identity or overwrite its files.'
          exit 1
        fi
        flags=()
        if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
        gh release create "$TAG" --verify-tag --draft --title "$RELEASE_TITLE" \
          --notes-file "dist/$APK_NAME.release-notes.md" "${flags[@]}" \
          "dist/$APK_NAME.apk" "dist/$APK_NAME.apk.sha256" \
          "dist/$APK_NAME.signing.txt" "dist/$APK_NAME.build-info.json" "dist/$APK_NAME.build-info.txt"
        # Publish only after all correctly named assets have uploaded.
        gh release edit "$TAG" --draft=false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-unit-test-results
        path: |
          app/build/reports/tests/
          app/build/test-results/
        if-no-files-found: ignore

    - name: Delete private signing keystore
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/proxydroid-release.keystore"

  encrypted-signing-backup:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Encrypt and verify offline signing backup
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PROXYDROID_BACKUP_PASSWORD: ${{ secrets.PROXYDROID_BACKUP_PASSWORD }}
        run: python3 scripts/create_signing_backup.py
      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: ProxyDroid-encrypted-signing-backup
          path: encrypted-signing-backup/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary encrypted output
        if: always()
        run: rm -rf encrypted-signing-backup
