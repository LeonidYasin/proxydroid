name: Release APK

# Signed release only. Manual dispatch without a tag builds an artifact, not a release.
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      tag:
        type: string
        required: false
        default: ''
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish. Empty = build artifact only.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.source_ref || github.ref }}

    - name: Validate signing configuration and release tag
      id: release
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        EXPECTED_SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || secrets.ANDROID_SIGNING_CERT_SHA256 }}
        INPUT_TAG: ${{ inputs.tag }}
      shell: bash
      run: |
        set -euo pipefail
        for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD EXPECTED_SIGNING_SHA256; do
          if [[ -z "${!name}" ]]; then
            echo "::error::Missing $name. Configure the persistent release keystore and certificate fingerprint; debug signing is not allowed."
            exit 1
          fi
        done
        fingerprint=$(printf '%s' "$EXPECTED_SIGNING_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Invalid signing certificate SHA-256'; exit 1; }
        VERSION=$(python3 - <<'PYVERSION'
        from pathlib import Path
        props = dict(line.split('=', 1) for line in Path('version.properties').read_text().splitlines() if line and not line.startswith('#'))
        values = [int(props['VERSION_' + name]) for name in ('MAJOR', 'MINOR', 'PATCH')]
        assert values[0] >= 0 and all(0 <= value < 100 for value in values[1:])
        print('.'.join(map(str, values)))
        PYVERSION
        )
        BUILD_SHA=$(git rev-parse HEAD)
        echo "sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
        TAG="$INPUT_TAG"
        if [[ "$GITHUB_EVENT_NAME" == push ]]; then TAG="$GITHUB_REF_NAME"; fi
        if [[ -n "$TAG" ]]; then
          [[ "$TAG" == "v$VERSION" || "$TAG" == "v$VERSION-"* ]] || { echo '::error::Tag does not match version.properties'; exit 1; }
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$BUILD_SHA" ]] || { echo '::error::Tag does not point at this build commit'; exit 1; }
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "name=proxydroid-$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest 2>/dev/null || true
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        fi
        if [ -z "$ANDROID_HOME" ]; then
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        fi
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        elif [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
          echo "$ANDROID_HOME/cmdline-tools/bin" >> $GITHUB_PATH
        fi
        if [ -d "$ANDROID_HOME/platform-tools" ]; then
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        fi

    - name: Install NDK and CMake
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "platforms;android-36" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

    - name: Setup Rust toolchain (Android targets for proxydroid-tun2socks)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          app/src/main/rust/proxydroid-tun2socks/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

    - name: Restore private signing keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/proxydroid-release.keystore"
        test -s "$RUNNER_TEMP/proxydroid-release.keystore"

    - name: Test and build signed Release APK
      env:
        BUILD_SHA: ${{ steps.release.outputs.sha }}
        KEYSTORE_PATH: ${{ runner.temp }}/proxydroid-release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        python3 scripts/check_tv_contract.py
        ./gradlew testReleaseUnitTest assembleRelease --no-daemon

    - name: Verify signature, certificate, non-debuggable flag and alignment
      env:
        EXPECTED_SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || secrets.ANDROID_SIGNING_CERT_SHA256 }}
        APK_NAME: ${{ steps.release.outputs.name }}
        BUILD_SHA: ${{ steps.release.outputs.sha }}
      shell: bash
      run: |
        set -euo pipefail
        APK=app/build/outputs/apk/release/app-release.apk
        TOOLS="$ANDROID_HOME/build-tools/34.0.0"
        mkdir -p dist
        "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/signature.txt
        actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/signature.txt | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        expected=$(printf '%s' "$EXPECTED_SIGNING_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        [[ "$actual" == "$expected" ]] || { echo '::error::Wrong signing certificate'; exit 1; }
        if grep -Eq 'Signer #1 certificate DN:.*CN=Android Debug' dist/signature.txt; then
          echo '::error::Android debug certificate is not a release identity'; exit 1
        fi
        "$TOOLS/zipalign" -c -v 4 "$APK"
        "$TOOLS/aapt" dump badging "$APK" > dist/package.txt
        if grep -q '^application-debuggable' dist/package.txt; then
          echo '::error::Release APK is debuggable'; exit 1
        fi
        cp "$APK" "dist/$APK_NAME.apk"
        (cd dist && sha256sum "$APK_NAME.apk" > "$APK_NAME.apk.sha256")
        printf 'Commit: %s\nVersion: %s\n' "$BUILD_SHA" "${APK_NAME#proxydroid-}" > dist/build-info.txt

    - name: Upload verified signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.release.outputs.name }}-signed-release
        path: dist/
        if-no-files-found: error
        retention-days: 30

    - name: Publish signed APK to GitHub Release
      if: steps.release.outputs.tag != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
        APK_NAME: ${{ steps.release.outputs.name }}
        BUILD_SHA: ${{ steps.release.outputs.sha }}
      shell: bash
      run: |
        set -euo pipefail
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "proxydroid $TAG" \
            --notes "Signed release APK from commit $BUILD_SHA. SHA-256 checksum and signing certificate attached." "${flags[@]}"
        fi
        # Never silently replace an already-published release binary.
        gh release upload "$TAG" "dist/$APK_NAME.apk" "dist/$APK_NAME.apk.sha256" \
          dist/signature.txt dist/build-info.txt

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-unit-test-results
        path: |
          app/build/reports/tests/
          app/build/test-results/
        if-no-files-found: ignore

    - name: Delete private signing keystore
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/proxydroid-release.keystore"
