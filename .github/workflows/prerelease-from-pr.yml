name: Pre-release from PR

# Testing builds use the same persistent release signer and verifier as releases.
# They are artifacts only: do not overwrite published rolling tags/binaries.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Repository ref to build (default: workflow ref)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: signed-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-prerelease:
    # A maintainer-applied label is the opt-in. Never expose signing credentials
    # to a fork PR. There is deliberately no pull_request_target execution.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'publish-rc' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/release-apk.yml
    with:
      source_ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
      tag: ''
    secrets: inherit

  comment-on-pr:
    needs: build-signed-prerelease
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Verified signed release APK is available in the workflow artifacts: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Existing releases were not overwritten.`
            });
