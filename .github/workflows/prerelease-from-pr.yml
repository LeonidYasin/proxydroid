name: Pre-release from PR

# Publishes a pre-release APK for every push to a feature/fix branch so the
# APK can be downloaded and installed BEFORE the PR is merged (see rule
# "for APK PRs, install the artefact before merge").
#
# How the version is built:
#   version.properties -> MAJOR.MINOR.PATCH
#   the pre-release tag is vMAJOR.MINOR.PATCH-rc<run_number>
#   e.g. 3.5.0 with run number 42  ->  v3.5.0-rc42
#
# Unlike release-apk.yml, this workflow does NOT create a real release tag and
# does NOT touch the versioned tags. It only publishes a GitHub pre-release so
# the artefact can be tested. The final tag (vX.Y.Z, no -rc) is created later by
# auto-tag-release.yml after merge to the default branch.

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: current ref)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish-prerelease:
    # Do not run for pushes that also update version.properties on the default
    # branch — those are handled by release-apk.yml / auto-tag-release.yml.
    if: github.ref_name != 'main' && github.ref_name != 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            cd "$HOME/android-sdk/cmdline-tools"
            curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest 2>/dev/null || true
            export ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          elif [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/bin" >> $GITHUB_PATH
          fi
          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          fi

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Setup Rust toolchain (Android targets for proxydroid-tun2socks)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src/main/rust/proxydroid-tun2socks/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

      - name: Read version from version.properties
        id: version
        run: |
          set -euo pipefail
          MAJOR=$(grep -E '^VERSION_MAJOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep -E '^VERSION_MINOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          PATCH=$(grep -E '^VERSION_PATCH=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          RC_NUM="${{ github.run_number }}"
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}-rc${RC_NUM}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rc_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Pre-release tag: $TAG"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-rc
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish pre-release to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.rc_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Pre-release $TAG already exists — uploading/replacing APK."
          else
            gh release create "$TAG" \
              --title "proxydroid $TAG (pre-release)" \
              --notes "Pre-release APK from branch '${{ github.ref_name }}' at commit ${GITHUB_SHA}. Version: $VERSION. Install on a device to test before merging the PR." \
              --prerelease
          fi
          gh release upload "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk#app-debug.apk \
            --clobber
          echo "Pre-release ready: $TAG"
