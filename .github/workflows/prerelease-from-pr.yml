name: Pre-release from PR

# Publishes ONE rolling pre-release APK per feature/fix branch so the APK can
# be downloaded and installed BEFORE the PR is merged.
#
# The tag is FIXED per version: vMAJOR.MINOR.PATCH-rc (no run number).
# Each new build re-points the tag onto the current commit and overwrites the
# APK inside the same release (gh release upload --clobber), so Releases always
# shows exactly ONE current pre-release for the branch, with a fresh commit SHA
# and a fresh publishedAt instead of a growing rc1, rc2, ... rcN pile.
#
# Trigger: manual dispatch, or adding the 'publish-rc' label to a PR.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build (default: current ref)'
        required: false
        default: ''

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-publish-prerelease:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'publish-rc')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            cd "$HOME/android-sdk/cmdline-tools"
            curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest 2>/dev/null || true
            export ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          elif [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/bin" >> $GITHUB_PATH
          fi
          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          fi

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Setup Rust toolchain (Android targets for proxydroid-tun2socks)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src/main/rust/proxydroid-tun2socks/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

      - name: Read version from version.properties
        id: version
        run: |
          set -euo pipefail
          MAJOR=$(grep -E '^VERSION_MAJOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep -E '^VERSION_MINOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          PATCH=$(grep -E '^VERSION_PATCH=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}-rc"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rc_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Rolling pre-release tag: $TAG"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-rc
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish rolling pre-release to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.rc_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${BUILD_SHA:0:8}"
          NOTES="Rolling pre-release APK for testing before merge.
          Version: ${VERSION}
          Built from commit: ${BUILD_SHA}
          Branch: ${{ github.event.pull_request.head.ref || github.ref_name }}"

          # Roll the git tag onto the CURRENT commit so the release page shows the
          # fresh source revision instead of a stale one. Without this, --clobber
          # updates only the APK asset and the tag keeps pointing at an old SHA.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$BUILD_SHA"
          git push -f origin "refs/tags/$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Pre-release $TAG exists — refreshing notes + overwriting APK with the fresh build."
            gh release edit "$TAG" --notes "$NOTES" --target "$BUILD_SHA"
          else
            gh release create "$TAG" \
              --title "proxydroid $TAG (rolling pre-release)" \
              --notes "$NOTES" \
              --target "$BUILD_SHA" \
              --prerelease
          fi
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk#app-debug.apk --clobber
          echo "Rolling pre-release ready: $TAG (commit $SHORT_SHA)"
          echo "Release publishedAt: $(gh release view "$TAG" --json publishedAt -q .publishedAt)"
          echo "Release tagName: $(gh release view "$TAG" --json tagName -q .tagName)"

      - name: Comment on PR with RC link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.rc_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh pr comment ${{ github.event.number }} --body "Rolling pre-release $TAG updated. Version: $VERSION. Download APK: https://github.com/${{ github.repository }}/releases/tag/$TAG"
