name: Auto Tag Release

# Publishes a git tag (vMAJOR.MINOR.PATCH) automatically when a PR that
# bumps version.properties is merged into the default branch.
#
# Flow:
#   1. Open a PR that changes VERSION_MAJOR/MINOR/PATCH in version.properties
#   2. Merge the PR into main
#   3. This workflow reads version.properties and creates the tag vX.Y.Z
#   4. The tag push triggers .github/workflows/release-apk.yml
#   5. release-apk.yml builds the APK and publishes it to GitHub Releases
#
# The workflow is idempotent: if the tag already exists it is a no-op.

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'version.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from version.properties
        id: version
        run: |
          set -euo pipefail
          MAJOR=$(grep -E '^VERSION_MAJOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep -E '^VERSION_MINOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          PATCH=$(grep -E '^VERSION_PATCH=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
            echo "::error::version.properties must define VERSION_MAJOR, VERSION_MINOR, VERSION_PATCH"
            exit 1
          fi
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG"

      - name: Create tag if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push origin "${TAG}"
          echo "Created and pushed tag ${TAG}."
