plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.mozilla.rust-android-gradle.rust-android'
}

// --- Version: single source of truth -----------------------------------------
// app version lives in ../version.properties so that a bump is a one-line change
// and .github/workflows/auto-tag-release.yml can derive the release tag from it.
def versionProps = new Properties()
file('../version.properties').withInputStream { versionProps.load(it) }

def vMajor = (versionProps.getProperty('VERSION_MAJOR') ?: '0').toInteger()
def vMinor = (versionProps.getProperty('VERSION_MINOR') ?: '0').toInteger()
def vPatch = (versionProps.getProperty('VERSION_PATCH') ?: '0').toInteger()
def vName  = "${vMajor}.${vMinor}.${vPatch}"
def vCode  = vMajor * 10000 + vMinor * 100 + vPatch

// --- Signing / local overrides -----------------------------------------------
// CI secrets are read from the environment, never written to local.properties.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'org.proxydroid'
    compileSdk 36
    ndkVersion "25.1.8937393"

    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_PATH') ?: localProps.getProperty('KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword (System.getenv('KEYSTORE_PASSWORD') ?: localProps.getProperty('KEYSTORE_PASSWORD'))
                keyAlias (System.getenv('KEY_ALIAS') ?: localProps.getProperty('KEY_ALIAS'))
                keyPassword (System.getenv('KEY_PASSWORD') ?: localProps.getProperty('KEY_PASSWORD'))
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    defaultConfig {
        applicationId "org.proxydroid"
        minSdk 24
        targetSdk 36
        versionCode vCode
        versionName vName

        // Surfaced in the About screen so the installed APK is identifiable.
        // BUILD_SHA comes from CI (GITHUB_SHA) when available; falls back to
        // "dev" for local builds.
        buildConfigField "String", "VERSION_NAME", "\"${vName}\""
        buildConfigField "String", "BUILD_RUN_ID", "\"${System.getenv('GITHUB_RUN_ID') ?: 'local'}\""
        buildConfigField "String", "BUILD_RUN_NUMBER", "\"${System.getenv('GITHUB_RUN_NUMBER') ?: 'local'}\""
        buildConfigField "String", "BUILD_RUN_ATTEMPT", "\"${System.getenv('GITHUB_RUN_ATTEMPT') ?: '1'}\""
        buildConfigField "String", "BUILD_SHA", "\"${System.getenv('BUILD_SHA') ?: System.getenv('GITHUB_SHA') ?: 'dev'}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


    }

    // All four ABI splits plus the universal package. Publishing exports only
    // universal and the requested compact ARM32 package; same signer/versionCode.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Always select the release signer: missing credentials must fail,
            // never silently produce an unsigned APK or use the debug signer.
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        // Must match the Kotlin version (see gradle/libs.versions.toml).
        kotlinCompilerExtensionVersion libs.versions.composeCompiler.get()
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI) ?: 'universal'
        output.outputFileName = "app-${abi}-${variant.buildType.name}.apk"
    }
}

cargo {
    module = "src/main/rust/proxydroid-tun2socks"
    libname = "proxydroid_tun2socks"
    targets = ["arm", "arm64", "x86", "x86_64"]
    profile = "release"
    prebuiltToolchains = true
}

tasks.whenTaskAdded { task ->
    if (task.name == 'mergeDebugJniLibFolders' || task.name == 'mergeReleaseJniLibFolders' ||
        task.name == 'javaPreCompileDebug' || task.name == 'javaPreCompileRelease') {
        task.dependsOn 'cargoBuild'
    }
}

dependencies {
    // Local JARs (none expected today, kept for parity with legacy layout)
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX core / app shell
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.material

    // Kotlin
    implementation libs.kotlin.stdlib

    // Jetpack Compose (BOM pins all artifact versions)
    def composeBom = platform(libs.compose.bom)
    implementation composeBom
    androidTestImplementation composeBom
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.compose.ui.tooling.preview
    debugImplementation libs.compose.ui.tooling
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.runtime.ktx

    // Third-party
    // json-simple drops JUnit as a compile dep; exclude to avoid runtime classpath pollution.
    implementation(libs.json.simple) {
        exclude group: 'junit', module: 'junit'
    }
    implementation libs.rhino

    // Unit test
    testImplementation libs.junit
    testImplementation libs.mockito.core

    // Android instrumented test
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.espresso.core
}
